<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.07" stroke="var(--fg)" stroke-width="1">
    <path d="M 0,200 H 800 M 0,400 H 800 M 0,600 H 800" />
    <path d="M 200,0 V 800 M 400,0 V 800 M 600,0 V 800" />
  </g>

  <!-- Outer Glow Ring -->
  <circle cx="400" cy="380" r="260" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" filter="url(#glow)" />

  <!-- Shield Base -->
  <path d="M 400,140 L 580,210 V 420 C 580,540 400,640 400,640 C 400,640 220,540 220,420 V 210 Z" fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)" />

  <!-- Inner Shield Detail -->
  <path d="M 400,180 L 540,236 V 410 C 540,508 400,590 400,590 C 400,590 260,508 260,410 V 236 Z" fill="#09090b" opacity="0.85" />

  <!-- GitHub Cat / Check / Guard Icon Elements -->
  <g transform="translate(400, 375) scale(1.3)" stroke="var(--fg)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield Check / Lock Core -->
    <path d="M -45,-30 H 45 V 45 C 45,75 0,100 0,100 C 0,100 -45,75 -45,45 Z" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.2"/>
    
    <!-- Code Brackets & Shield Checkmark -->
    <path d="M -35,-15 L -60,15 L -35,45" fill="none" stroke="#6366f1" stroke-width="8" />
    <path d="M 35,-15 L 60,15 L 35,45" fill="none" stroke="#ec4899" stroke-width="8" />
    <path d="M -15,15 L 5,35 L 35,-5" fill="none" stroke="#10b981" stroke-width="8" />
  </g>

  <!-- Title Text -->
  <text x="400" y="695" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" fill="#f8fafc" letter-spacing="2">GITHUB POLICY GUARD</text>
  
  <!-- Subtitle Text -->
  <text x="400" y="735" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="4">AGENT SECURITY &amp; COMPLIANCE</text>
</svg>
